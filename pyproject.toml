[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "forex-bot"
version = "0.1.0"
description = "Event-driven forex trading bot for major US economic news releases"
requires-python = ">=3.12"
dependencies = [
    "ib_async",
    "httpx",
    "beautifulsoup4",
    "lxml",
    "fredapi",
    "pydantic>=2.0",
    "pydantic-settings",
    "sqlalchemy>=2.0",
    "apscheduler>=3.10",
    "typer",
    "rich",
    "python-dotenv",
    "pyyaml",
    "loguru",
    "aiosqlite",
    "libsql-experimental",
]

[project.optional-dependencies]
# Pinned to match requirements-dev.txt so CI (pip install -e .[dev]) uses the
# same tool versions as local + the pre-commit hook. Leaving these unpinned let
# CI pull newer ruff/pytest with stricter defaults, failing every PR — even
# doc-only ones — on violations local never saw. Keep in sync with
# requirements-dev.txt.
dev = [
    "pytest==9.0.3",
    "pytest-asyncio==1.4.0",
    "pytest-mock==3.15.1",
    "ruff==0.15.17",
]

[project.scripts]
forex-bot = "forex_bot.cli:app"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
markers = [
    "integration: requires IB Gateway running",
]

[tool.ruff]
target-version = "py312"
