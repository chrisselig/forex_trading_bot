broker:
  host: "127.0.0.1"
  port: 4002
  client_id: 1
  timeout: 30

trading:
  instruments:
    - USDTRY
    # USDZAR removed 2026-07-30 — report 18 (net-of-cost audit): the event
    #   straddle's gross edge (+16.5 pips) is smaller than the real IDEALPRO
    #   round-trip spread (~24 pips), so all 8 USDZAR event sources are net
    #   losers (pooled net -7.49 [-9.78,-5.12], OOS worse). Robust to the thin
    #   spread sample. NOTE: USDZAR is still traded by the CARRY book (separate
    #   carry.instruments) — this only disables the USDZAR event straddle.
    # USDTRY kept pending real multi-session IDEALPRO spread data — report 18
    #   verdict is a coin flip (net -1.17 [-2.97,+0.65]) that hinges on whether
    #   the true spread is ~6 or ~12 pips; sample_ib_spreads.py is collecting it.
    # USDJPY and AUDUSD removed 2026-07-24 — report 16 (corrected data):
    #   USDJPY/BOJ no edge (+0.9, CI spans 0); AUDUSD 0/9 combos pass.
    # GBPUSD/GBPJPY/USDCAD remain excluded — "avoid" verdicts hold (report 16).
  default_timeframe: "5 mins"

risk:
  max_risk_per_trade_pct: 1.5
  max_daily_drawdown_pct: 5.0
  max_concurrent_positions: 4
  mandatory_stop_loss: true
  # Bug-catcher backstop now that TWS precautionary size limits are bypassed
  # for API orders (IBC BypassOrderPrecautions=yes). Above legit exotic-pair
  # sizing (USDTRY straddles ~2.5M units); an order past this is a sizing bug.
  max_order_units: 10000000
  # Max % of AvailableFunds one order's initial margin may consume. Exotic
  # pairs carry huge margin rates (USDTRY ~30%, USDZAR ~10%), so risk-sized
  # orders can demand far more margin than the account holds — IB rejects
  # those with Error 201. The engine whatIf-checks margin before placing and
  # scales quantity down to fit under this cap. 25% leaves headroom for
  # concurrent event pairs (up to 4) each holding one filled straddle leg.
  max_margin_pct_per_trade: 25.0
  max_spread_pips: 15.0          # Default for majors
  max_spread_overrides:           # Per-pair overrides for exotics (straddle only)
    USDTRY: 80.0                  # Event-time spreads routinely 30-60 pips
    # USDZAR override removed with the USDZAR straddle (report 18). Carry keeps
    # its own carry.max_spread_overrides.USDZAR — do not confuse the two.

strategy:
  pre_event_minutes: 30
  post_event_minutes: 60
  min_pre_event_lead_seconds: 90   # Late-start catch-up: place straddle only if >= this much lead remains
  straddle_distance_pips: 50   # Default (USDZAR/USDTRY — 6.5yr MC, Jun 2026)
  straddle_tp_pips: 70         # 7:1 R:R, 30.7% win rate (breakeven 12.5%)
  straddle_sl_pips: 10         # Min 10 pips for news event spread safety
  straddle_pair_overrides:
    # USDZAR override removed 2026-07-30 (report 18: net loser after real
    # spread). USDTRY only, pending live spread data on its coin-flip verdict.
    USDTRY:
      distance_pips: 50        # US events (NFP/CPI/FOMC) — 6.5yr MC
      tp_pips: 70
      sl_pips: 10
      event_overrides:
        TCMB Interest Rate Decision:  # key must exactly match the event target name/alias
          distance_pips: 35     # Report 16 optimum on corrected data (+13.1 vs +9.0 at old 20/60/10)
          tp_pips: 70
          sl_pips: 10
  surprise_threshold_pct: 10.0
  surprise_entry_delay_seconds: 5
  surprise_tp_pips: 25
  surprise_sl_pips: 15
  max_holding_minutes: 120

carry:
  enabled: true
  instruments: [USDZAR, USDTRY, USDMXN, AUDJPY, NZDJPY]
  min_differential_pct: 2.0
  risk_budget_pct: 5.0
  max_concurrent_carry: 5
  max_risk_per_carry_pct: 5.0
  stop_loss_pct: 5.0
  rebalance_day_of_week: mon  # Monday: TWS is up, FX is liquid (avoids weekend TWS-down + wide Sunday-open spreads)
  rebalance_hour_utc: 14  # 14:00 UTC = 8 AM MT / 10 AM ET (London-NY overlap, tight spreads)
  fallback_rates:
    # Safety net only — TRY now resolves live via FRED IRSTCI01TRM156N (OECD
    # call money, ~35.5% as of 2026-03). Used solely if the FRED fetch fails.
    TRY: 35.0
  max_spread_pips: 30.0
  max_spread_overrides:
    USDZAR: 60.0
    USDTRY: 80.0
  # COT crash-risk filter — blocks a new carry entry when leveraged funds
  # are already crowded (|z-score| >= threshold) in the same direction we'd
  # be trading, over a trailing 3yr window. TRY/NZD have no CFTC-listed
  # future, so this never blocks USDTRY (fails open on missing data).
  cot_crowding_enabled: true
  cot_zscore_threshold: 2.0
  cot_lookback_weeks: 156

# Value / PPP — long undervalued currencies, short overvalued ones, judged by
# the real exchange rate's deviation from its long-run mean (relative PPP).
# Developed-market majors only (their real rates mean-revert; exotics trend).
# UNVALIDATED: no Monte Carlo walk-forward backs this yet — keep disabled until
# validated. Rebalances monthly on the 1st at 14:37 UTC.
value:
  enabled: false
  instruments: [EURUSD, GBPUSD, USDJPY, USDCAD, AUDUSD, NZDUSD, USDCHF]
  lookback_years: 8         # window for the real-exchange-rate mean
  z_threshold: 1.0          # min |z-score| of RER deviation to trade
  max_concurrent_value: 4
  max_risk_per_value_pct: 1.0
  stop_loss_pct: 8.0        # wide — value positions held for months
  rebalance_day_of_month: 1
  rebalance_hour_utc: 14
  rebalance_minute: 37
  max_spread_pips: 20.0
  max_spread_overrides: {}

# Reporting — daily P&L snapshot pushed to Telegram. Answers "am I up or down
# right now" for the open carry book (unrealized, held for weeks — the
# closed-trade `performance` command can't show this). Runs inside the bot
# process on its existing IB connection (no clientId collision).
reporting:
  daily_pnl_snapshot_enabled: true
  daily_pnl_snapshot_hour_utc: 21    # 3:30 PM MT — after NY session, back from work
  daily_pnl_snapshot_minute_utc: 30
